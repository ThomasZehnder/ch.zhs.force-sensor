; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;



[env:nodemcuv2]
platform = espressif8266
framework = arduino
board = nodemcuv2
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default, time
build_type = release
board_build.filesystem = littlefs
lib_deps =
	ESP8266WiFi  ; WiFi and WiFiClientSecure functionality
	bblanchon/ArduinoJson@^6.19.4
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0
	; HX711 is vendored locally in lib/HX711 (forked from bogde/HX711@^0.7.5) with the
	; noInterrupts()/interrupts() guard removed around the 24-bit read, see lib/HX711/src/HX711.cpp

