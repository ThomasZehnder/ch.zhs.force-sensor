<!DOCTYPE html>
<html>

<head>
    <title>Force Sensor Display</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .home-link {
            position: absolute;
            top: 14px;
            left: 14px;
            color: #ff6a00;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(255, 106, 0, 0.6);
        }

        .home-link:hover {
            color: #ff9a40;
        }

        .row {
            display: flex;
            align-items: flex-end;
        }

        .display {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .digit {
            position: relative;
            width: 50px;
            height: 90px;
        }

        .seg {
            position: absolute;
            background: #3a0000; /* unlit segment */
            transition: background 0.08s, box-shadow 0.08s;
        }

        .seg.on {
            background: #ff1a1a;
            box-shadow: 0 0 12px 3px rgba(255, 26, 26, 0.85);
        }

        .segA, .segG, .segD {
            left: 6px;
            width: 38px;
            height: 9px;
            clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
        }
        .segA { top: 0; }
        .segG { top: 40.5px; }
        .segD { top: 81px; }

        .segF, .segB, .segE, .segC {
            width: 9px;
            height: 35px;
            clip-path: polygon(0% 12%, 50% 0%, 100% 12%, 100% 88%, 50% 100%, 0% 88%);
        }
        .segF { top: 6px; left: 0; }
        .segB { top: 6px; left: 41px; }
        .segE { top: 49px; left: 0; }
        .segC { top: 49px; left: 41px; }

        .dp {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #3a0000;
            margin: 0 2px 6px 2px;
        }

        .dp.on {
            background: #ff1a1a;
            box-shadow: 0 0 12px 3px rgba(255, 26, 26, 0.85);
        }

        .unit {
            color: #ff1a1a;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 32px;
            margin-left: 18px;
            text-shadow: 0 0 8px rgba(255, 26, 26, 0.8);
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.15; }
        }

        .display.blink {
            animation: blink 0.6s step-start infinite;
        }

        .status {
            color: #ff6a00;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 22px;
            letter-spacing: 4px;
            text-align: center;
            min-height: 26px;
            margin-top: 14px;
            text-shadow: 0 0 8px rgba(255, 106, 0, 0.8);
        }
    </style>
</head>

<body>
    <a class="home-link" href="/">&#8962; Home</a>
    <div class="wrap">
        <div class="row">
            <div class="display" id="displayId"></div>
            <div class="unit">N</div>
        </div>
        <div class="status" id="statusId"></div>
    </div>

    <script>
        var SEGMENTS = {
            '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc',
            '5': 'afgcd', '6': 'afgecd', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg',
            '-': 'g', ' ': ''
        };

        function buildDigit() {
            var digit = document.createElement('div');
            digit.className = 'digit';
            'ABCDEFG'.split('').forEach(function (seg) {
                var s = document.createElement('div');
                s.className = 'seg seg' + seg;
                s.dataset.seg = seg.toLowerCase();
                digit.appendChild(s);
            });
            return digit;
        }

        function setDigit(digitEl, ch) {
            var lit = SEGMENTS[ch] || '';
            var segs = digitEl.querySelectorAll('.seg');
            for (var i = 0; i < segs.length; i++) {
                segs[i].classList.toggle('on', lit.indexOf(segs[i].dataset.seg) !== -1);
            }
        }

        // layout: [sign][1000][100][10][1] . [0.1] - covers -9999.9 .. 9999.9 N
        var displayEl = document.getElementById('displayId');
        var intDigitEls = [];
        for (var i = 0; i < 5; i++) {
            var d = buildDigit();
            intDigitEls.push(d);
            displayEl.appendChild(d);
        }
        var dpEl = document.createElement('div');
        dpEl.className = 'dp on';
        displayEl.appendChild(dpEl);
        var fracDigitEl = buildDigit();
        displayEl.appendChild(fracDigitEl);

        var OVERLOAD_LIMIT = 9999.9; // largest value the [sign][1000][100][10][1].[0.1] layout can show
        var FETCH_TIMEOUT_MS = 2000;
        var statusEl = document.getElementById('statusId');

        function setStatus(text) {
            statusEl.textContent = text;
        }

        function formatChars(value) {
            var negative = value < 0;
            var v = Math.abs(value);
            var parts = v.toFixed(1).split('.');
            var intPadded = parts[0].padStart(4, ' ');
            return [negative ? '-' : ' '].concat(intPadded.split('')).concat([parts[1]]);
        }

        function showValue(value) {
            displayEl.classList.remove('blink');
            var chars = formatChars(value);
            for (var i = 0; i < 5; i++) {
                setDigit(intDigitEls[i], chars[i]);
            }
            setDigit(fracDigitEl, chars[5]);
            setStatus('');
        }

        function showOverload() {
            for (var i = 0; i < 5; i++) {
                setDigit(intDigitEls[i], '-');
            }
            setDigit(fracDigitEl, '-');
            displayEl.classList.add('blink');
            setStatus('OVERLOAD');
        }

        var pollSemaphore = true;
        function pollForce() {
            if (!pollSemaphore) {
                return; // last request not answered yet, skip this tick
            }
            pollSemaphore = false;

            var controller = new AbortController();
            var timeoutId = setTimeout(function () {
                controller.abort();
            }, FETCH_TIMEOUT_MS);

            fetch('/assembly', { signal: controller.signal })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(function (data) {
                    var value = Number(data.force);
                    if (!isFinite(value) || Math.abs(value) > OVERLOAD_LIMIT) {
                        showOverload();
                    } else {
                        showValue(value);
                    }
                })
                .catch(function (error) {
                    console.error('Error loading assembly:', error);
                    setStatus(error.name === 'AbortError' ? 'TIMEOUT' : 'NO CONNECTION');
                })
                .finally(function () {
                    clearTimeout(timeoutId);
                    pollSemaphore = true;
                });
        }

        pollForce();
        setInterval(pollForce, 500);
    </script>
</body>

</html>
